name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bash:
    name: Bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Run Bash suite, including install, introspection, and security contracts
        shell: bash
        run: bash ./tests/test_aagent.sh

  test-powershell:
    name: PowerShell (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Run PowerShell suite, including install, introspection, and security contracts
        shell: pwsh
        run: ./tests/test_aagent.ps1

  release-gate:
    name: Release gate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Run the reproducible local release gate
        shell: bash
        run: bash ./scripts/release-gate.sh
